name: Deploy Landing

# Same shape as the frontend and backend pipelines: on every push to master,
# copy the code to the server and rebuild this one service through the shared
# docker compose in /opt/lawcopilot.
#
# Needs these repository secrets (the same ones lawapp-frontend uses):
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY
# And on the server, a service named below in /opt/lawcopilot/docker-compose.yml.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  SERVICE: landing-app
  REMOTE_DIR: /opt/lawcopilot/landing/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy Landing Code
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_DIR }}"

      - name: Rebuild and Recreate Landing Container
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
          set -e
          cd /opt/lawcopilot

          echo "Building ${{ env.SERVICE }}..."
          docker compose build ${{ env.SERVICE }}
          docker compose up -d --no-deps --force-recreate ${{ env.SERVICE }}

          echo "Waiting for the health check..."
          for i in $(seq 1 20); do
            if docker compose exec -T ${{ env.SERVICE }} node -e "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"; then
              echo "Landing is healthy"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Landing did not become healthy"
              docker compose logs --tail=80 ${{ env.SERVICE }}
              exit 1
            fi
            sleep 3
          done

          docker image prune -f
          docker compose ps ${{ env.SERVICE }}
          EOF
